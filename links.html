<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD Viewer Links</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #17202a;
        background: #f5f7f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #566372;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      input {
        width: min(360px, 42vw);
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid #bac5d0;
        border-radius: 6px;
        font: inherit;
      }

      button,
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid #b6c1cc;
        border-radius: 6px;
        background: #ffffff;
        color: #17202a;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a.button:hover {
        background: #eef2f5;
      }

      .status {
        margin: 12px 0;
        color: #566372;
        font-size: 14px;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        background: #ffffff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 980px;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #e5ebf0;
        text-align: left;
        vertical-align: top;
        font-size: 14px;
      }

      th {
        background: #f8fafc;
        color: #43505d;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #eef2f5;
        color: #1d2a36;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      .url-cell {
        max-width: 360px;
      }

      .url-cell a {
        display: block;
        color: #0a6ea8;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        background: #e8f5ee;
        color: #17613a;
        font-size: 12px;
        font-weight: 750;
      }

      .pill.missing {
        background: #fff1e8;
        color: #9a4a12;
      }

      @media (max-width: 760px) {
        header {
          display: grid;
          align-items: start;
        }

        .toolbar {
          width: 100%;
        }

        input {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CAD Viewer Link Map</h1>
          <p>Project hashes, GLB models, and public viewer URLs.</p>
        </div>
        <div class="toolbar">
          <input id="filter" type="search" placeholder="Filter project, model, or hash" />
          <button id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <p id="status" class="status">Loading links...</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Project</th>
              <th>Model</th>
              <th>Hash</th>
              <th>Size</th>
              <th>Status</th>
              <th>Viewer URL</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="links-body"></tbody>
        </table>
      </div>
    </main>

    <script type="module">
      const statusNode = document.querySelector("#status");
      const tableBody = document.querySelector("#links-body");
      const filterInput = document.querySelector("#filter");
      const refreshButton = document.querySelector("#refresh");
      let links = [];

      refreshButton.addEventListener("click", loadLinks);
      filterInput.addEventListener("input", renderLinks);

      await loadLinks();

      async function loadLinks() {
        statusNode.textContent = "Loading links...";
        const response = await fetch("api/viewer-links");
        if (!response.ok) {
          statusNode.textContent = `Unable to load links: ${response.status}`;
          return;
        }

        const data = await response.json();
        links = data.links || [];
        statusNode.textContent = `${data.count || links.length} mapped model links`;
        renderLinks();
      }

      function renderLinks() {
        const filter = filterInput.value.trim().toLowerCase();
        const rows = links.filter((link) => {
          if (!filter) return true;
          return [link.projectNumber, link.modelFileName, link.queryHash]
            .join(" ")
            .toLowerCase()
            .includes(filter);
        });

        tableBody.innerHTML = rows.map(renderRow).join("");
        tableBody.querySelectorAll("[data-copy]").forEach((button) => {
          button.addEventListener("click", async () => {
            await navigator.clipboard.writeText(button.dataset.copy);
            button.textContent = "Copied";
            window.setTimeout(() => {
              button.textContent = button.dataset.label;
            }, 1200);
          });
        });
      }

      function renderRow(link) {
        const size = link.fileSizeMb == null ? "Unknown" : `${link.fileSizeMb} MB`;
        return `
          <tr>
            <td><strong>${escapeHtml(link.projectNumber)}</strong></td>
            <td>${escapeHtml(link.modelFileName)}</td>
            <td><code>${escapeHtml(link.queryHash)}</code></td>
            <td>${escapeHtml(size)}</td>
            <td>
              <span class="pill ${link.readable ? "" : "missing"}">
                ${escapeHtml(link.readable ? "Readable" : "Unavailable")}
              </span>
            </td>
            <td class="url-cell">
              <a href="${escapeAttribute(link.viewerUrl)}" target="_blank" rel="noreferrer">
                ${escapeHtml(link.viewerUrl)}
              </a>
            </td>
            <td>
              <div class="actions">
                <button type="button" data-label="Copy Hash" data-copy="${escapeAttribute(link.queryHash)}">Copy Hash</button>
                <button type="button" data-label="Copy URL" data-copy="${escapeAttribute(link.viewerUrl)}">Copy URL</button>
                <a class="button" href="${escapeAttribute(link.viewerUrl)}" target="_blank" rel="noreferrer">Open</a>
              </div>
            </td>
          </tr>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replaceAll("`", "&#096;");
      }
    </script>
  </body>
</html>
