<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HubSpot Webhook Log</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --ink: #1f2933;
        --muted: #667085;
        --line: #d7dde5;
        --accent: #0b6bcb;
        --accent-dark: #084f96;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .bar,
      main {
        width: min(1440px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 68px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      input,
      select,
      button {
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      input {
        width: min(360px, 72vw);
        padding: 0 10px;
      }

      select {
        padding: 0 30px 0 10px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: var(--accent-dark);
      }

      main {
        padding: 18px 0 32px;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      table {
        width: 100%;
        min-width: 1180px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        white-space: nowrap;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #eef2f6;
        font-size: 12px;
        color: #344054;
        text-transform: uppercase;
      }

      tbody tr:hover {
        background: #f5f9ff;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .muted {
        color: var(--muted);
      }

      .empty {
        padding: 36px;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>HubSpot Webhook Log</h1>
        <div class="controls">
          <input id="token" type="password" autocomplete="off" placeholder="Webhook token" />
          <select id="limit" aria-label="Event limit">
            <option value="25">25 rows</option>
            <option value="50" selected>50 rows</option>
            <option value="100">100 rows</option>
            <option value="200">200 rows</option>
          </select>
          <button id="save">Save Token</button>
          <button id="refresh" class="primary">Refresh</button>
        </div>
      </div>
    </header>

    <main>
      <div class="meta">
        <div id="summary">Waiting for token.</div>
        <div id="status" class="status"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Received</th>
              <th>Project ID</th>
              <th>Serial Number Name</th>
              <th>Explicit Serial</th>
              <th>Source Name</th>
              <th>HubSpot Object</th>
              <th>Source Object</th>
              <th>Modified</th>
              <th>Source</th>
              <th>Props</th>
              <th>Event ID</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr>
              <td colspan="11" class="empty">Enter the webhook token and refresh.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script>
      const tokenInput = document.querySelector("#token");
      const limitInput = document.querySelector("#limit");
      const rows = document.querySelector("#rows");
      const status = document.querySelector("#status");
      const summary = document.querySelector("#summary");

      tokenInput.value = localStorage.getItem("hubspotWebhookToken") || "";

      document.querySelector("#save").addEventListener("click", () => {
        localStorage.setItem("hubspotWebhookToken", tokenInput.value.trim());
        status.textContent = "Token saved.";
        status.classList.remove("error");
      });

      document.querySelector("#refresh").addEventListener("click", loadEvents);

      if (tokenInput.value) loadEvents();

      async function loadEvents() {
        const token = tokenInput.value.trim();
        if (!token) {
          status.textContent = "Token required.";
          status.classList.add("error");
          return;
        }

        status.textContent = "Loading...";
        status.classList.remove("error");

        try {
          const response = await fetch(
            `api/hubspot/webhook-events?limit=${encodeURIComponent(limitInput.value)}`,
            { headers: { token } }
          );
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);

          renderRows(data.events || []);
          summary.textContent = `${data.count} events loaded. Generated ${formatDate(data.generatedAt)}.`;
          status.textContent = "";
        } catch (error) {
          status.textContent = error.message;
          status.classList.add("error");
        }
      }

      function renderRows(events) {
        if (!events.length) {
          rows.innerHTML = `<tr><td colspan="11" class="empty">No webhook events captured.</td></tr>`;
          return;
        }

        rows.innerHTML = events.map((event) => `
          <tr>
            <td>${escapeHtml(formatDate(event.receivedAt))}</td>
            <td class="mono">${escapeHtml(event.projectId || "")}</td>
            <td>${escapeHtml(event.serialNumberName || "")}</td>
            <td>${escapeHtml(event.explicitSerialNumberName || "")}</td>
            <td>${escapeHtml(event.sourceName || "")}</td>
            <td class="mono">${escapeHtml(event.hubspotObjectId || "")}</td>
            <td class="mono">${escapeHtml(event.sourceObjectId || "")}</td>
            <td class="mono">${escapeHtml(event.hubspotLastModifiedAt || "")}</td>
            <td>${escapeHtml(event.source || "")}</td>
            <td class="mono">${escapeHtml(String(event.propertyCount ?? ""))}</td>
            <td class="mono muted">${escapeHtml(event.id || "")}</td>
          </tr>
        `).join("");
      }

      function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
